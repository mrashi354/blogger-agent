name: Daily Blog Post

on:
  schedule:
    # 9:00 AM IST (Asia/Kolkata = UTC+5:30).
    # 09:00 IST - 05:30 = 03:30 UTC, so we schedule 03:30 UTC.
    # GitHub cron always uses UTC.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish as draft instead of live"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-blog-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_BASE_URL: https://api.groq.com/openai/v1
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      BLOG_ID: ${{ secrets.BLOG_ID }}
      DRAFT_MODE: ${{ secrets.DRAFT_MODE }}
      BLOG_NICHE: ${{ secrets.BLOG_NICHE }}
      BLOG_LANGUAGE: ${{ secrets.BLOG_LANGUAGE }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Preflight - fail fast if a secret is missing
        run: |
          missing=""
          for name in LLM_API_KEY LLM_MODEL PIXABAY_API_KEY GOOGLE_CLIENT_ID \
                      GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN BLOG_ID \
                      DRAFT_MODE BLOG_NICHE BLOG_LANGUAGE; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repo secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All 10 required secrets are present."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure bot git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run daily post (generate, image, publish, log)
        run: |
          # --push-image-first commits and pushes today's image before publishing,
          # so the jsDelivr CDN URL in the post HTML already resolves.
          if [ "${{ inputs.draft }}" = "true" ]; then
            python main.py --draft --push-image-first
          else
            python main.py --push-image-first
          fi

      - name: Commit posted_log.json
        run: |
          git add posted_log.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update posted log $(date -u +%Y-%m-%d)"
            git push
          fi